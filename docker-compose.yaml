services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password # demo base, it's not secure
      POSTGRES_DB: dbname
    volumes:
      #sql files are executed alphabetically, only on first start (empty volume)
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/dbname
      PORT: 8000
      JWT_SECRET: demo-secret-change-me # TODO: variable should be set in .env file
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api #TODO: variable name consistent with frontend code
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
